services:
  job-hunter:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-hunter-ai:local
    container_name: job-hunter-ai
    restart: unless-stopped
    init: true
    shm_size: "512mb"
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/jobs.sqlite3
      HH_PROFILE_DIR: /app/data/hh-profile
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
